## 対象範囲・対象外

## 指摘事項

各指摘は `### [blocker / important] タイトル` とし、位置、根拠、影響、推奨対応を記載してください。該当がない場合は `指摘なし` と明記してください。

## 指摘なしとして確認した観点

## 判断不能・ユーザー確認事項
