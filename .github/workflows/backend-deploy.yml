name: Deploy Cloudflare backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "package.json"
      - "package-lock.json"
      - "biome.json"
      - "tsconfig.json"
      - ".github/workflows/backend-deploy.yml"
      - ".github/workflows/quality.yml"
      - ".github/workflows/workspace-test.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-backend
  cancel-in-progress: false

jobs:
  root-quality:
    uses: ./.github/workflows/quality.yml

  backend-test:
    needs: root-quality
    uses: ./.github/workflows/workspace-test.yml
    with:
      workspace: backend
      script: test

  backend-integration:
    needs: root-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reset local Worker state
        run: npm --workspace=@neon-underrealm/backend run local:reset

      - name: Apply local D1 migrations
        run: npm --workspace=@neon-underrealm/backend run migrate:local

      - name: Start local Worker
        run: npm --workspace=@neon-underrealm/backend run dev:local > "$RUNNER_TEMP/backend.log" 2>&1 &

      - name: Wait for local Worker
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error http://127.0.0.1:8787/health; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::The local Worker did not become reachable."
          exit 1

      - name: Run backend integration test
        run: npm --workspace=@neon-underrealm/backend run test:integration

      - name: Remove local Worker state
        if: always()
        run: npm --workspace=@neon-underrealm/backend run local:reset

  deploy:
    needs:
      - root-quality
      - backend-test
      - backend-integration
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
      AWS_ENDPOINT_URL_S3: ${{ vars.TF_STATE_R2_ENDPOINT }}
      AWS_REGION: auto
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
      TERRAFORM_TFVARS: ${{ vars.TERRAFORM_TFVARS }}
      TF_CLI_ARGS_init: >-
        -backend-config=bucket=${{ vars.TF_STATE_R2_BUCKET_NAME }}
        -backend-config=key=${{ vars.TF_STATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Install dependencies
        run: npm ci

      - name: Materialize Terraform resource inputs
        run: |
          umask 077
          printf '%s' "$TERRAFORM_TFVARS" > backend/terraform/local.tfvars

      - name: Build Worker bundle
        run: npm --workspace=@neon-underrealm/backend run build

      - name: Initialize Terraform state
        run: terraform -chdir=backend/terraform init

      - name: Validate Terraform
        run: npm --workspace=@neon-underrealm/backend run terraform:validate

      - name: Apply backend infrastructure
        run: terraform -chdir=backend/terraform apply -lock-timeout=5m -auto-approve -var-file=local.tfvars
