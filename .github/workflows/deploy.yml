name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - ".agents/**"
      - "AGENTS.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  root-quality:
    uses: ./.github/workflows/quality.yml

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      shared: ${{ steps.filter.outputs.shared }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'package-lock.json'
              - 'biome.json'
              - 'tsconfig.json'
              - '.github/workflows/**'
            shared:
              - 'packages/shared/**'
              - 'package.json'
              - 'package-lock.json'
              - 'biome.json'
              - 'tsconfig.json'
              - '.github/workflows/**'
            backend:
              - 'backend/**'
              - 'package.json'
              - 'package-lock.json'
              - 'biome.json'
              - 'tsconfig.json'
              - '.github/workflows/**'

  frontend-test:
    needs:
      - root-quality
      - changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    uses: ./.github/workflows/workspace-test.yml
    with:
      workspace: '@neon-underrealm/frontend'
      script: test:coverage

  shared-test:
    needs:
      - root-quality
      - changes
    if: ${{ needs.changes.outputs.shared == 'true' }}
    uses: ./.github/workflows/workspace-test.yml
    with:
      workspace: '@neon-underrealm/shared'
      script: test

  backend-test:
    needs:
      - root-quality
      - changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    uses: ./.github/workflows/workspace-test.yml
    with:
      workspace: backend
      script: test

  backend-integration:
    needs:
      - root-quality
      - changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local database and object storage
        run: docker compose -f backend/compose.yml up --detach

      - name: Start local backend
        run: npm --workspace=@neon-underrealm/backend run dev:local > "$RUNNER_TEMP/backend.log" 2>&1 &

      - name: Wait for local backend
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error http://127.0.0.1:8787/health; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::The local backend did not become reachable."
          exit 1

      - name: Run backend integration test
        run: npm --workspace=@neon-underrealm/backend run test:integration

      - name: Stop local services
        if: always()
        run: docker compose -f backend/compose.yml down

  build:
    needs:
      - root-quality
      - frontend-test
      - shared-test
      - backend-test
      - backend-integration
    if: >-
      ${{ always() && needs.root-quality.result == 'success'
      && (needs.frontend-test.result == 'success' || needs.frontend-test.result == 'skipped')
      && (needs.shared-test.result == 'success' || needs.shared-test.result == 'skipped')
      && (needs.backend-test.result == 'success' || needs.backend-test.result == 'skipped')
      && (needs.backend-integration.result == 'success' || needs.backend-integration.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Require Cloudflare Web Analytics token
        env:
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_WEB_ANALYTICS_TOKEN" ]; then
            echo "::error::CLOUDFLARE_WEB_ANALYTICS_TOKEN repository variable must be set before deployment."
            exit 1
          fi

      - name: Build
        env:
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: npm --workspace=@neon-underrealm/frontend run build:public

      - name: Build search index
        run: npm --workspace=@neon-underrealm/frontend run build:search-index

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  public-e2e:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for deployed site
        env:
          E2E_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --output /dev/null "$E2E_BASE_URL"; then
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::The deployed GitHub Pages site did not become reachable."
              exit 1
            fi
            sleep 5
          done

      - name: Run Public E2E
        env:
          E2E_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm --workspace=@neon-underrealm/frontend run test:e2e:public

      - name: Upload Public E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-e2e-diagnostics
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 7
