name: Quality CI

on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - ".codex/**/*.toml"
  pull_request:
    paths-ignore:
      - ".codex/**/*.toml"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      markdown: ${{ steps.filter.outputs.markdown }}
      quality: ${{ steps.filter.outputs.quality }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            markdown:
              - '**/*.md'
            quality:
              - '**'
              - '!**/*.md'
              - '!.codex/**/*.toml'

  markdown:
    needs: changes
    if: ${{ needs.changes.outputs.markdown == 'true' && needs.changes.outputs.quality != 'true' }}
    uses: ./.github/workflows/markdown-check.yml

  quality:
    needs: changes
    if: ${{ needs.changes.outputs.quality == 'true' }}
    uses: ./.github/workflows/quality.yml
