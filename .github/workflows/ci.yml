name: Quality CI

on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - ".codex/**/*.toml"
permissions:
  contents: read

jobs:
  root-quality:
    uses: ./.github/workflows/quality.yml

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      shared: ${{ steps.filter.outputs.shared }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'package-lock.json'
              - 'biome.json'
              - 'tsconfig.json'
              - '.github/workflows/**'
            shared:
              - 'packages/shared/**'
              - 'package.json'
              - 'package-lock.json'
              - 'biome.json'
              - 'tsconfig.json'
              - '.github/workflows/**'
            backend:
              - 'backend/**'
              - 'package.json'
              - 'package-lock.json'
              - 'biome.json'
              - 'tsconfig.json'
              - '.github/workflows/**'

  frontend-test:
    needs:
      - root-quality
      - changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    uses: ./.github/workflows/workspace-test.yml
    with:
      workspace: '@neon-underrealm/frontend'
      script: test:coverage

  shared-test:
    needs:
      - root-quality
      - changes
    if: ${{ needs.changes.outputs.shared == 'true' }}
    uses: ./.github/workflows/workspace-test.yml
    with:
      workspace: '@neon-underrealm/shared'
      script: test

  backend-test:
    needs:
      - root-quality
      - changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    uses: ./.github/workflows/workspace-test.yml
    with:
      workspace: backend
      script: test

  backend-integration:
    needs:
      - root-quality
      - changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local database and object storage
        run: docker compose -f backend/compose.yml up --detach

      - name: Start local backend
        run: npm --workspace=@neon-underrealm/backend run dev:local > "$RUNNER_TEMP/backend.log" 2>&1 &

      - name: Wait for local backend
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error http://127.0.0.1:8787/health; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::The local backend did not become reachable."
          exit 1

      - name: Run backend integration test
        run: npm --workspace=@neon-underrealm/backend run test:integration

      - name: Stop local services
        if: always()
        run: docker compose -f backend/compose.yml down
