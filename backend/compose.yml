services:
  database:
    image: ghcr.io/tursodatabase/libsql-server:latest
    environment:
      SQLD_NODE: primary
    ports:
      - "8080:8080"
    volumes:
      - local-database:/var/lib/sqld

  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: local-development
      MINIO_ROOT_PASSWORD: local-development-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - local-storage:/data

  storage-init:
    image: minio/mc:latest
    depends_on:
      - storage
    entrypoint: >-
      /bin/sh -c 'until mc alias set local http://storage:9000 local-development local-development-password; do sleep 1; done; mc mb --ignore-existing local/neon-underrealm-local'

volumes:
  local-database:
  local-storage:
